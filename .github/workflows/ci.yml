name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug-asan-ubsan
            flags: -DCMAKE_BUILD_TYPE=Debug -DLUMA_ENABLE_ASAN=ON
          - name: debug-tsan
            flags: -DCMAKE_BUILD_TYPE=Debug -DLUMA_ENABLE_TSAN=ON
          - name: release
            flags: -DCMAKE_BUILD_TYPE=Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (${{ matrix.name }})
        run: cmake -S . -B build-${{ matrix.name }} ${{ matrix.flags }}

      - name: Build (${{ matrix.name }})
        run: cmake --build build-${{ matrix.name }} -j

      - name: Test (${{ matrix.name }})
        run: ctest --test-dir build-${{ matrix.name }} --output-on-failure
